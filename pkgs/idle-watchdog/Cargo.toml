[package]
name = "idle-watchdog"
version = "0.1.0"
edition = "2024"

[lib]
name = "idle_watchdog"
path = "src/lib.rs"

[[bin]]
name = "opencode-idle-watchdog"
path = "src/bin/opencode-idle-watchdog.rs"

[[bin]]
name = "t3-idle-watchdog"
path = "src/bin/t3-idle-watchdog.rs"

[dependencies]
anyhow = "1.0.98"
base64 = "0.22.1"
clap = { version = "4.6.2", features = ["derive"] }
comfy-table = "8.0.0"
jiff = { version = "0.2.35", features = ["serde"] }
libc = "0.2.174"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0.141"
signal-hook = "0.3.18"
tempfile = "3.20.0"
ureq = { version = "3.3.0", default-features = false }

[profile.release]
lto = "thin"
strip = true
