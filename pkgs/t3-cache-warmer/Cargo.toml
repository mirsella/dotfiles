[package]
name = "t3-cache-warmer"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.98"
base64 = "0.22.1"
clap = { version = "4.6.2", features = ["derive"] }
form_urlencoded = "1.2.2"
getrandom = "0.3.3"
jiff = { version = "0.2.35", features = ["serde"] }
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.141"
sha2 = "0.10.9"
signal-hook = "0.3.18"
ureq = { version = "3.3.0", default-features = false }

[profile.release]
lto = "thin"
strip = true
