name: flake check

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
      # A cold store cannot evaluate the profiles with --no-build: the Hermes
      # configuration reads uv.lock out of the built hermes-python-source store
      # path, so the evaluation itself needs that build. Build every check
      # instead, plus host-tools with its Rust tests and the camofox package
      # so regressions and broken patch anchors fail before deployment.
      - name: Build the checks, host-tools tests, and the camofox patch
        run: |
          nix build --no-link \
            .#checks.x86_64-linux.hosts \
            .#checks.x86_64-linux.memory \
            .#checks.x86_64-linux.predator \
            .#checks.x86_64-linux.hermes-browser-policy \
            .#checks.x86_64-linux.host-tools-fmt \
            .#checks.x86_64-linux.data-unlock \
            .#checks.x86_64-linux.arch-maintenance \
            .#host-tools \
            .#camofox-browser
