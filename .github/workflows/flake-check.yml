name: flake check

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: cachix/install-nix-action@v31
      # Hermes reads uv.lock from a built source during evaluation, so --no-build
      # cannot evaluate a cold store. The aggregate builds every declared check,
      # host-tools with its Rust tests, and the camofox patch.
      - name: Build the checks, host-tools tests, and the camofox patch
        run: nix build --no-link .#ci
