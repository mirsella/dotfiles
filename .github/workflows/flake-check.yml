name: flake check

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
      # Evaluates every profile and the invariant checks without building them,
      # which is the same gate AGENTS.md asks for before pushing to main.
      - run: nix flake check --no-build --no-update-lock-file
