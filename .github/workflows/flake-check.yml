name: flake check

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: cachix/install-nix-action@v31
      # Hermes reads uv.lock from a built source during evaluation, so --no-build
      # cannot evaluate a cold store.
      - name: Build the CI aggregate
        run: nix build --no-link .#ci
